<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image carousel</title>
    <script defer src="slideshow.js"></script>
    <link rel="stylesheet" href="./style.css" />
    <script
      src="https://kit.fontawesome.com/c28df1f041.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="photo-display">
      <img
        id="carousel-img"
        src="./assets/cute-cat-a.png"
        alt="cat-pic"
        width="400"
        height="300"
      />
      <div id="buttonField">
        <button
          type="button"
          id="auto-backward-btn"
          aria-label="auto-backward-btn"
        >
          Auto <i class="fa-solid fa-backward"></i>
        </button>
        <button type="button" id="backward-btn" aria-label="backward-btn">
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <input id="auto-seconds" type="number" min="1" placeholder="Auto Ss" />
        <button type="button" id="stop-btn" aria-label="stop-btn">
          <i class="fa-solid fa-stop"></i>
        </button>
        <button type="button" id="forward-btn" aria-label="forward-btn">
          <i class="fa-solid fa-play"></i>
        </button>
        <button
          type="button"
          id="auto-forward-btn"
          aria-label="auto-forward-btn"
        >
          Auto <i class="fa-solid fa-forward"></i>
        </button>
      </div>
    </div>
  </body>
</html>
